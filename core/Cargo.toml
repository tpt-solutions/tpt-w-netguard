# SPDX-License-Identifier: MIT OR Apache-2.0
[package]
name = "tpt-netguard-core"
version = "0.1.0"
description = "Traffic model, firewall/monitor traits, aggregation, and history store for tpt-netguard"
license.workspace = true
authors.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
default = ["sqlite"]
# On-disk / in-memory history store (persistent per-app history, alert and connection logs).
sqlite = ["dep:rusqlite"]
# Archon backend stubs (design only; every call is Unsupported until upstream primitives exist).
archon = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
