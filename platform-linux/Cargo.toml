# SPDX-License-Identifier: MIT OR Apache-2.0
[package]
name = "tpt-netguard-platform-linux"
version = "0.1.0"
description = "Linux backend (/proc attribution, nftables + eBPF enforcement). Phase 4."
license.workspace = true
authors.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
tpt-netguard-core = { path = "../core", default-features = false }

# eBPF loader (userspace side). The kernel programs are built by build.rs from ebpf/.
[target.'cfg(target_os = "linux")'.dependencies]
aya = "0.14"
libc = "0.2"

