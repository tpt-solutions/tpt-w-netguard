# Kernel-side eBPF programs for tpt-netguard. Built by platform-linux/build.rs for the
# bpfel-unknown-none target; not a member of the main workspace.
[package]
name = "tpt-netguard-ebpf"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
aya-ebpf = "0.3"

[[bin]]
name = "tpt-netguard-ebpf"
path = "src/main.rs"

[profile.release]
lto = true
panic = "abort"
codegen-units = 1

[workspace]
